name: run-tests

on:
    push:
        branches:
            - master
            - symfony-5
    pull_request: ~
    workflow_dispatch: ~

jobs:
    phpunit:
        runs-on: ubuntu-latest
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                testsuite: ["functional", "unit", "installer"]
        name: PHPUnit - ${{ matrix.testsuite }}
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: forkcms
                    MYSQL_ROOT_PASSWORD: "kingtriton"
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-php-8.5-composer-${{ hashFiles('composer.json') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick
                  coverage: none

            - name: Prepare test env
              run: |
                  mysql -h 127.0.0.1 -uroot -pkingtriton -e 'create database forkcms_test'
                  mysql -h 127.0.0.1 -uroot -pkingtriton forkcms_test < tests/data/test_db.sql
                  cp app/config/parameters.yml.test app/config/parameters.yml

            - name: Install dependencies
              env:
                  FORK_ENV: test
              run: composer install -o

            - name: Execute tests
              run: bin/simple-phpunit --testsuite=${{ matrix.testsuite }}

            - name: Display error logs on failure
              if: failure()
              run: cat var/logs/test.log || true

    phpstan:
        name: PHPStan - Static Code Analysis
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: forkcms
                    MYSQL_ROOT_PASSWORD: "kingtriton"
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-php-8.5-composer-${{ hashFiles('composer.json') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick
                  coverage: none

            - name: Prepare config
              run: |
                  mysql -h 127.0.0.1 -uroot -pkingtriton forkcms < tests/data/test_db.sql
                  cp app/config/parameters.yml.test app/config/parameters.yml

            - name: Install dependencies
              run: composer install -o --no-scripts

            - name: Warm cache
              run: |
                  echo "FORK_DEBUG=1" > .env.local
                  rm -rf var/cache/dev
                  php bin/console cache:warmup --env=dev || true
                  test -f var/cache/dev/ForkCMS_App_AppKernelDevDebugContainer.xml || (echo "Container XML not generated" && exit 1)

            - name: Run PHPStan
              run: bin/phpstan analyze --error-format github src

    php-code-sniffer:
        name: PHP Code Sniffer
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-php-8.5-composer-${{ hashFiles('composer.json') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick
                  coverage: none

            - name: Install dependencies
              run: composer install -o --no-scripts

            - name: Run PHP Codesniffer
              run: bin/phpcs --standard=psr2 --extensions=php --warning-severity=0 --ignore=src/Backend/Core/Js/ckfinder,src/Backend/Cache,src/Frontend/Cache,src/Backend/Core/Js/ckeditor --report=full "src"

    frontend:
        name: npm test
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install Node
              uses: actions/setup-node@v6
              with:
                  node-version: '26'
                  cache: 'npm'

            - run: npm ci
            - run: npm test

    docker-test:
        name: Docker
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-php-8.5-composer-${{ hashFiles('composer.json') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick
                  coverage: none

            - name: Install dependencies
              run: composer install -o --no-scripts

            - name: Build Docker image
              run: docker compose build

            - name: Start stack
              run: docker compose up -d

            - name: Wait for app to be ready
              run: |
                  for i in $(seq 1 30); do
                      curl -sf http://localhost:80 && break || sleep 5
                  done

            - name: Test
              run: |
                  curl -s -L -o /dev/null -w "%{http_code}" http://localhost:80 | grep -q '200'
                  curl -s -L http://localhost:80 | grep -q 'Install Fork CMS'

            - name: Display error logs on failure
              if: failure()
              run: docker compose logs

            - name: Cleanup
              if: always()
              run: docker compose down -v
